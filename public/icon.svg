<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6C2" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1F1D" />
      <stop offset="100%" stop-color="#140F0E" />
    </radialGradient>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" />

  <!-- Outer Gold Ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#gold)" stroke-width="2" />

  <!-- Inner Delicate Ring -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.65" stroke-dasharray="1.5 1.5" />

  <!-- Brand Typography MH2 -->
  <text
    x="31"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    fill="url(#gold)"
    font-family="Georgia, 'Cormorant Garamond', 'Times New Roman', serif"
    font-size="20"
    font-weight="700"
    letter-spacing="-0.5"
  >
    MH<tspan font-size="13" dy="3.5" font-weight="600">2</tspan>
  </text>
</svg>

